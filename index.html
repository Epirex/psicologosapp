<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psicólogos Catamarca</title>
    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card-psico {
            transition: transform 0.2s;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .card-psico:hover {
            transform: translateY(-5px);
        }
        .badge-custom {
            background-color: #4CAF50;
            color: white;
        }
        .filter-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        .no-results {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }
        .results-counter {
            margin: 15px 0;
            font-size: 0.9em;
            color: #6c757d;
        }
        .sort-reset-section {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Psicólogos de Catamarca</h1>
        
        <!-- Sección de Filtros -->
        <div class="filter-section">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <input type="text" id="searchInput" class="form-control" placeholder="Buscar por nombre...">
                </div>
                <div class="col-md-6">
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <select id="filterEspecialidad" class="form-control">
                                <option value="">Todas las especialidades</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <select id="filterObraSocial" class="form-control">
                                <option value="">Obra social</option>
                                <option value="SI">Acepta obra social</option>
                                <option value="NO">No acepta obra social</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <select id="filterDomicilio" class="form-control">
                                <option value="">Atención a domicilio</option>
                                <option value="SI">Disponible</option>
                                <option value="NO">No disponible</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Sección Ordenar y Resetear -->
            <div class="row sort-reset-section">
                <div class="col-md-6">
                    <select id="sortCriteria" class="form-control">
                        <option value="">Ordenar por...</option>
                        <option value="nombre-asc">Nombre (A-Z)</option>
                        <option value="nombre-desc">Nombre (Z-A)</option>
                        <option value="especialidad-asc">Especialidad (A-Z)</option>
                        <option value="mp-asc">M.P (Ascendente)</option>
                    </select>
                </div>
                <div class="col-md-6 text-right">
                    <button id="resetFilters" class="btn btn-secondary">
                        <i class="fas fa-sync-alt"></i> Reiniciar Filtros
                    </button>
                </div>
            </div>
        </div>

        <!-- Contador de resultados -->
        <div id="resultsCounter" class="results-counter"></div>

        <!-- Contenedor de tarjetas -->
        <div class="row" id="psicologos-container"></div>
        
        <!-- Mensaje sin resultados -->
        <div id="no-results" class="no-results" style="display: none;">
            <h4>No se encontraron profesionales con esos criterios</h4>
            <p>Intenta ajustar los filtros o la búsqueda</p>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>
    <!-- Font Awesome para el ícono del botón -->
    <script src="https://kit.fontawesome.com/a076d05399.js"></script>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        let allPsicologos = [];
        let uniqueEspecialidades = new Set();

        // Inicializar filtros
        function initFilters() {
            allPsicologos.forEach(psico => {
                psico.orientacion.split(', ').forEach(esp => uniqueEspecialidades.add(esp));
            });
            
            const especialidadSelect = document.getElementById('filterEspecialidad');
            Array.from(uniqueEspecialidades).sort().forEach(esp => {
                const option = document.createElement('option');
                option.value = esp;
                option.textContent = esp;
                especialidadSelect.appendChild(option);
            });
        }

        // Crear tarjeta individual
        function createCard(psicologo) {
            return `
            <div class="col-md-4">
                <div class="card card-psico">
                    <div class="card-body">
                        <h5 class="card-title">${psicologo.nombre}</h5>
                        <span class="badge badge-custom">M.P ${psicologo['M.P']}</span>
                        
                        <div class="mt-3">
                            <h6 class="text-muted">Contacto:</h6>
                            <p class="card-text">
                                <strong>Teléfono:</strong><br>
                                ${psicologo.telefono.replace(/\//g, '<br>')}
                            </p>
                            <p class="card-text">
                                <strong>Dirección:</strong><br>
                                ${psicologo.domicilio_laboral}
                            </p>
                        </div>
                        
                        <div class="mt-3">
                            <h6 class="text-muted">Especialización:</h6>
                            <p class="card-text">
                                <strong>Orientación:</strong> ${psicologo.orientacion}<br>
                                <strong>Área clínica:</strong> ${psicologo.clinica}
                            </p>
                        </div>
                        
                        <div class="mt-3">
                            <span class="badge ${psicologo.domicilio === 'SI' ? 'badge-success' : 'badge-secondary'}">
                                Domicilio: ${psicologo.domicilio}
                            </span>
                            <span class="badge ${psicologo.obra_social === 'SI' ? 'badge-info' : 'badge-secondary'}">
                                Obra social: ${psicologo.obra_social}
                            </span>
                        </div>
                    </div>
                </div>
            </div>`;
        }

        // Actualizar contador de resultados
        function updateResultsCounter(filteredCount) {
            const counter = document.getElementById('resultsCounter');
            counter.textContent = `Mostrando ${filteredCount} de ${allPsicologos.length} profesionales encontrados`;
        }

        // Función para ordenar los resultados
        function sortResults(data, criteria) {
            switch(criteria) {
                case 'nombre-asc':
                    return [...data].sort((a, b) => a.nombre.localeCompare(b.nombre));
                case 'nombre-desc':
                    return [...data].sort((a, b) => b.nombre.localeCompare(a.nombre));
                case 'especialidad-asc':
                    return [...data].sort((a, b) => a.orientacion.localeCompare(b.orientacion));
                case 'mp-asc':
                    return [...data].sort((a, b) => a['M.P'] - b['M.P']);
                default:
                    return data;
            }
        }

        // Función principal de filtrado y ordenamiento
        function filterAndSort() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const especialidad = document.getElementById('filterEspecialidad').value;
            const obraSocial = document.getElementById('filterObraSocial').value;
            const domicilio = document.getElementById('filterDomicilio').value;
            const sortBy = document.getElementById('sortCriteria').value;

            // Filtrar
            let filtered = allPsicologos.filter(psico => {
                const nameMatch = psico.nombre.toLowerCase().includes(searchTerm);
                const espMatch = !especialidad || psico.orientacion.includes(especialidad);
                const osMatch = !obraSocial || psico.obra_social === obraSocial;
                const domMatch = !domicilio || psico.domicilio === domicilio;
                
                return nameMatch && espMatch && osMatch && domMatch;
            });

            // Ordenar
            filtered = sortResults(filtered, sortBy);

            // Mostrar resultados
            const container = document.getElementById('psicologos-container');
            container.innerHTML = '';
            
            if (filtered.length > 0) {
                filtered.forEach(psico => container.insertAdjacentHTML('beforeend', createCard(psico)));
                document.getElementById('no-results').style.display = 'none';
            } else {
                document.getElementById('no-results').style.display = 'block';
            }
            
            updateResultsCounter(filtered.length);
        }

        // Función para resetear filtros
        function resetAllFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('filterEspecialidad').value = '';
            document.getElementById('filterObraSocial').value = '';
            document.getElementById('filterDomicilio').value = '';
            document.getElementById('sortCriteria').value = '';
            filterAndSort();
        }

        // Cargar datos iniciales
        fetch('https://raw.githubusercontent.com/Epirex/psicologos-api/gh-pages/psicologos.json')
            .then(response => response.json())
            .then(data => {
                allPsicologos = data;
                initFilters();
                filterAndSort();
                
                // Event listeners
                document.getElementById('searchInput').addEventListener('input', filterAndSort);
                document.getElementById('filterEspecialidad').addEventListener('change', filterAndSort);
                document.getElementById('filterObraSocial').addEventListener('change', filterAndSort);
                document.getElementById('filterDomicilio').addEventListener('change', filterAndSort);
                document.getElementById('sortCriteria').addEventListener('change', filterAndSort);
                document.getElementById('resetFilters').addEventListener('click', resetAllFilters);
            })
            .catch(error => console.error('Error:', error));
    });
    </script>
</body>
</html>
